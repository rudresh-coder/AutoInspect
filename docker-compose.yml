services:

  postgres:
    image: postgres:16
    container_name: autoinspect-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: autoinspect
      POSTGRES_USER: autoinspect
      POSTGRES_PASSWORD: autoinspect_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: autoinspect-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data: